<!DOCTYPE html>
<html>
<head>
    <title>Eleven-y-7</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-image: url('https://i.imgur.com/yourimage.png'); /* Replace this with the direct URL */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
        }
        .game-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .game {
            margin: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
        }
        .game img {
            width: 150px;
            height: 150px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .game img:hover {
            transform: scale(1.1);
        }
        .game p {
            font-size: 16px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Welcome to Eleven-y-7</h1>
    <div class="game-container">
        <div class="game">
            <a href="https://www.roblox.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Roblox_Logo_2021.svg/1920px-Roblox_Logo_2021.svg.png" alt="Roblox">
            </a>
            <p>Roblox</p>
        </div>
        <div class="game">
            <a href="https://www.minecraft.net/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png" alt="Minecraft">
            </a>
            <p>Minecraft</p>
        </div>
        <div class="game">
            <a href="https://www.sudoku.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Sudoku-by-L2G-20050714.svg" alt="Sudoku">
            </a>
            <p>Sudoku</p>
        </div>
        <div class="game">
            <a href="https://www.y8.com/games/football_legends_2021" target="_blank">
                <img src="https://img.y8.com/cloud/y8-thumbs/117991/big.jpg" alt="Football Legends 2021">
            </a>
            <p>Football Legends 2021</p>
        </div>
        <div class="game">
            <a href="https://www.y8.com/games/fireboy_and_watergirl_5_elements" target="_blank">
                <img src="https://img.y8.com/cloud/y8-thumbs/100458/big.jpg" alt="Fireboy & Watergirl 5">
            </a>
            <p>Fireboy & Watergirl 5</p>
        </div>
        <div class="game">

        </div>
    </div>
</body>
</html>
